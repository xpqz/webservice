<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
  <title id="t">The pattern</title>
  <desc id="d">A client sends HTTP to nginx, the only service with a public port. nginx shares requests round-robin among N identical APL workers, which each talk to the database over ODBC. The workers and the database sit on a private Docker Compose network.</desc>
  <style>
    .bg     { fill: #ffffff; }
    .fg     { fill: #1d2a31; }
    .muted  { fill: #5c6c75; }
    .box    { fill: #ffffff; stroke-width: 1.8; }
    .net    { fill: #f2f6f8; stroke: #b9c6cd; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .wire   { stroke: #1d2a31; stroke-width: 1.6; fill: none; }
    .head   { fill: #1d2a31; }
    .client { stroke: #6b4fa3; } .t-client { fill: #6b4fa3; }
    .edge   { stroke: #3f7d3a; } .t-edge   { fill: #3f7d3a; }
    .apl    { stroke: #17708f; } .t-apl    { fill: #17708f; }
    .db     { stroke: #a2621b; } .t-db     { fill: #a2621b; }
    .port   { fill: #3f7d3a; }
    .port-t { fill: #ffffff; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #11191d; }
      .fg     { fill: #e1e9ed; }
      .muted  { fill: #93a5ae; }
      .box    { fill: #172126; }
      .net    { fill: #152025; stroke: #33454e; }
      .wire   { stroke: #e1e9ed; }
      .head   { fill: #e1e9ed; }
      .client { stroke: #ad94e6; } .t-client { fill: #ad94e6; }
      .edge   { stroke: #82c27a; } .t-edge   { fill: #82c27a; }
      .apl    { stroke: #5db9da; } .t-apl    { fill: #5db9da; }
      .db     { stroke: #e0a25a; } .t-db     { fill: #e0a25a; }
      .port   { fill: #82c27a; }
      .port-t { fill: #11191d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="400" rx="14"/>

  <!-- private network -->
  <rect class="net" x="250" y="40" width="625" height="330" rx="14"/>
  <text class="muted" x="270" y="66" font-size="13" letter-spacing="0.5">Docker Compose network · private</text>

  <!-- client -->
  <rect class="box client" x="30" y="160" width="140" height="80" rx="10"/>
  <text class="t-client" x="100" y="196" text-anchor="middle" font-size="17" font-weight="600">client</text>
  <text class="muted" x="100" y="218" text-anchor="middle" font-size="12.5">browser, curl, …</text>

  <!-- nginx, straddling the boundary -->
  <rect class="box edge" x="215" y="160" width="150" height="80" rx="10"/>
  <text class="t-edge" x="290" y="196" text-anchor="middle" font-size="17" font-weight="600">nginx</text>
  <text class="muted" x="290" y="218" text-anchor="middle" font-size="12.5">load balancer</text>
  <!-- published port tag -->
  <rect class="port" x="222" y="138" width="62" height="22" rx="11"/>
  <text class="port-t" x="253" y="153.5" text-anchor="middle" font-size="12" font-weight="600">:8080</text>
  <text class="muted" x="290" y="268" text-anchor="middle" font-size="12">the only public port</text>

  <!-- client to nginx -->
  <line class="wire" x1="172" y1="200" x2="211" y2="200" marker-end="url(#arrow)"/>
  <text class="muted" x="191" y="190" text-anchor="middle" font-size="11.5">HTTP</text>

  <!-- workers -->
  <g>
    <rect class="box apl" x="455" y="90" width="170" height="64" rx="10"/>
    <text class="t-apl" x="540" y="118" text-anchor="middle" font-size="15" font-weight="600">APL worker</text>
    <text class="muted" x="540" y="138" text-anchor="middle" font-size="12">Dyalog + Stark</text>

    <rect class="box apl" x="455" y="168" width="170" height="64" rx="10"/>
    <text class="t-apl" x="540" y="196" text-anchor="middle" font-size="15" font-weight="600">APL worker</text>
    <text class="muted" x="540" y="216" text-anchor="middle" font-size="12">Dyalog + Stark</text>

    <rect class="box apl" x="455" y="246" width="170" height="64" rx="10"/>
    <text class="t-apl" x="540" y="274" text-anchor="middle" font-size="15" font-weight="600">APL worker</text>
    <text class="muted" x="540" y="294" text-anchor="middle" font-size="12">Dyalog + Stark</text>
  </g>
  <text class="muted" x="540" y="340" text-anchor="middle" font-size="12.5">N identical, stateless copies</text>

  <!-- nginx to workers -->
  <path class="wire" d="M367,186 C410,186 412,122 451,122" marker-end="url(#arrow)"/>
  <line class="wire" x1="367" y1="200" x2="451" y2="200" marker-end="url(#arrow)"/>
  <path class="wire" d="M367,214 C410,214 412,278 451,278" marker-end="url(#arrow)"/>
  <text class="muted" x="400" y="306" text-anchor="middle" font-size="11.5">round-robin</text>

  <!-- database cylinder -->
  <g>
    <path class="box db" d="M715,150 L715,250 A70,16 0 0 0 855,250 L855,150"/>
    <ellipse class="box db" cx="785" cy="150" rx="70" ry="16"/>
    <text class="t-db" x="785" y="204" text-anchor="middle" font-size="17" font-weight="600">database</text>
    <text class="muted" x="785" y="226" text-anchor="middle" font-size="12.5">existing, as is</text>
  </g>

  <!-- workers to database -->
  <path class="wire" d="M627,122 C670,122 672,184 711,184" marker-end="url(#arrow)"/>
  <line class="wire" x1="627" y1="200" x2="711" y2="200" marker-end="url(#arrow)"/>
  <path class="wire" d="M627,278 C670,278 672,216 711,216" marker-end="url(#arrow)"/>
  <text class="muted" x="680" y="306" text-anchor="middle" font-size="11.5">SQL over ODBC</text>
</svg>
